name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0）；手动触发时不会自动打 tag'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          V="${V#v}"
          if ! [[ "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::版本号必须形如 1.2.3，实际为 '$V'"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.name }}
      APP_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Write signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_B64 仓库 Secret"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing/ci-release.jks
          {
            echo "storeFile=ci-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PppVersionName="$APP_VERSION" \
            -PppVersionCode="$APP_CODE"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/PhonePcTransfer-$APP_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  pc:
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX 3.11
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip' -OutFile wix311.zip
          Expand-Archive wix311.zip -DestinationPath pc/tools/wix311 -Force

      - name: Build PC jar
        shell: bash
        run: |
          mkdir -p pc/build/classes pc/dist
          find pc/src -name '*.java' > pc/build/sources.txt
          javac -encoding UTF-8 --release 17 -Xlint:none \
            -cp pc/lib/concentus-1.0.2.jar -d pc/build/classes @pc/build/sources.txt
          rm -rf pc/build/concentus && mkdir -p pc/build/concentus
          (cd pc/build/concentus && jar xf ../../lib/concentus-1.0.2.jar io)
          cp -r pc/build/concentus/io pc/build/classes/
          printf 'version=%s\n' "$APP_VERSION" > pc/build/classes/version.properties
          jar --create --file pc/dist/PhonePcTransfer-PC.jar \
            --main-class com.phonepctransfer.pc.PcMain -C pc/build/classes .

      - name: Build runtime image
        shell: bash
        run: |
          jlink --add-modules java.base,java.datatransfer,java.xml,java.prefs,java.desktop,java.logging,java.management,java.security.sasl,java.naming,java.net.http,java.transaction.xa,java.sql,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 \
            --output pc/tools/runtime

      - name: Build MSI
        shell: bash
        env:
          APP_VER: ${{ needs.version.outputs.name }}
        run: |
          export PP_JDK_HOME="$(cygpath -u "$JAVA_HOME")"
          bash tools/make-msi.sh
          mkdir -p dist
          cp "out/手机电脑互传-$APP_VER.msi" "dist/PhonePcTransfer-$APP_VER.msi"
          cp pc/dist/PhonePcTransfer-PC.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pc-dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, android, pc]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## 更新日志

          - 增加配对验证
          - 优化传输效率
          - 修复大量潜在 bug

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | Android | PhonePcTransfer-$APP_VERSION.apk | Android 8.0+，直接安装 |
          | Windows | PhonePcTransfer-$APP_VERSION.msi | 一键安装，含运行时与 ffmpeg |
          | 任意桌面 | PhonePcTransfer-PC.jar | 免安装，需 JDK 17+ |

          CI 使用独立签名证书，装 Release 版前请先卸载本地开发包。
          EOF
          TAG="v$APP_VERSION"
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "手机电脑互传 $APP_VERSION" \
              --notes-file notes.md
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "手机电脑互传 $APP_VERSION" \
              --notes-file notes.md
          fi
