name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_VERSION: 1.1.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Write signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_B64 仓库 Secret"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing/ci-release.jks
          {
            echo "storeFile=ci-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PppVersionName="$APP_VERSION" \
            -PppVersionCode=$((10100 + ${GITHUB_RUN_NUMBER}))

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/PhonePcTransfer-$APP_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX 3.11
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip' -OutFile wix311.zip
          Expand-Archive wix311.zip -DestinationPath pc/tools/wix311 -Force

      - name: Build PC jar
        shell: bash
        run: |
          mkdir -p pc/build/classes pc/dist
          find pc/src -name '*.java' > pc/build/sources.txt
          javac -encoding UTF-8 --release 17 -Xlint:none \
            -cp pc/lib/concentus-1.0.2.jar -d pc/build/classes @pc/build/sources.txt
          rm -rf pc/build/concentus && mkdir -p pc/build/concentus
          (cd pc/build/concentus && jar xf ../../lib/concentus-1.0.2.jar io)
          cp -r pc/build/concentus/io pc/build/classes/
          jar --create --file pc/dist/PhonePcTransfer-PC.jar \
            --main-class com.phonepctransfer.pc.PcMain -C pc/build/classes .

      - name: Build runtime image
        shell: bash
        run: |
          jlink --add-modules java.base,java.datatransfer,java.xml,java.prefs,java.desktop,java.logging,java.management,java.security.sasl,java.naming,java.net.http,java.transaction.xa,java.sql,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 \
            --output pc/tools/runtime

      - name: Build MSI
        shell: bash
        env:
          APP_VER: ${{ env.APP_VERSION }}
        run: |
          export PP_JDK_HOME="$(cygpath -u "$JAVA_HOME")"
          bash make-msi.sh
          mkdir -p dist
          cp "out/手机电脑互传-$APP_VER.msi" "dist/PhonePcTransfer-$APP_VER.msi"
          cp pc/dist/PhonePcTransfer-PC.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pc-dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          局域网内手机 ⇄ 电脑的文件 / 文本 / 文件夹互传，自动识别对方客户端；支持局域网视频与语音通话。

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | Android | PhonePcTransfer-$APP_VERSION.apk | Android 8.0+，直接安装 |
          | Windows | PhonePcTransfer-$APP_VERSION.msi | 一键安装，含运行时与 ffmpeg |
          | 任意桌面 | PhonePcTransfer-PC.jar | 免安装，需 JDK 17+ |

          本次构建由提交 ${GITHUB_SHA:0:7} 自动生成。

          注意：CI 构建使用独立签名证书，与本地开发包签名不同，首次安装请先卸载旧版；之后各 Release 之间可直接覆盖升级。
          EOF
          TAG="v$APP_VERSION"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create -R "$GITHUB_REPOSITORY" "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "手机电脑互传 $APP_VERSION" \
              --notes-file notes.md
          fi
